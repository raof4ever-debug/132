<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Offline AI Storytelling Trainer</title>

<style>

body{
background:#020617;
color:#fff;
font-family:Tahoma;
margin:0;
}

header{
background:#0f172a;
padding:20px;
text-align:center;
font-size:22px;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:#111827;
padding:20px;
border-radius:12px;
margin-top:20px;
}

textarea{
width:100%;
height:140px;
padding:10px;
border-radius:8px;
font-size:16px;
}

button{
background:#3b82f6;
border:none;
padding:12px 25px;
margin-top:15px;
color:#fff;
border-radius:8px;
cursor:pointer;
}

.stat{
display:inline-block;
margin:10px;
font-size:18px;
}

.progressbar{
background:#1e293b;
height:10px;
border-radius:6px;
margin-top:10px;
}

.fill{
background:#22c55e;
height:10px;
width:0%;
border-radius:6px;
}

.feedback{
margin-top:20px;
background:#020617;
padding:15px;
border-radius:10px;
}

</style>
</head>

<body>

<header>
🧠 Offline AI Storytelling Trainer
</header>

<div class="container">

<div class="card">
<div id="stats"></div>
</div>

<div class="card">
<h3 id="question"></h3>
<textarea id="answer"></textarea>
<br>
<button onclick="submitAnswer()">Analyze Answer</button>
</div>

<div class="card feedback" id="feedback"></div>

</div>

<script>

/* ===============================
   OFFLINE DATABASE
================================ */

const QUESTIONS=[
"اكتب قصة تروّج دواء جديد.",
"ابدأ إعلان بجملة Hook قوية.",
"حوّل ميزة المنتج لقصة.",
"احكي تجربة عميل قبل وبعد.",
"اكتب Story عاطفية للبيع."
];

let state=JSON.parse(localStorage.getItem("AITrainer"))||{
xp:0,
index:0,
level:1
};

/* ===============================
   AI ENGINE (OFFLINE NLP)
================================ */

const emotionalWords=["ألم","خوف","راحة","أمل","معاناة"];
const hookWords=["تخيل","هل تعلم","ماذا لو","سر","الحقيقة"];
const transitionWords=["ثم","بعد","أخيرًا","وبعدها"];

function analyze(text){

let words=text.split(" ").length;

let emotionScore=emotionalWords.filter(w=>text.includes(w)).length*2+4;
let hookScore=hookWords.filter(w=>text.includes(w)).length*3+4;
let storyScore=transitionWords.filter(w=>text.includes(w)).length*2+4;
let clarityScore=Math.min(10,Math.floor(words/5));

emotionScore=Math.min(10,emotionScore);
hookScore=Math.min(10,hookScore);
storyScore=Math.min(10,storyScore);

let overall=Math.round((emotionScore+hookScore+storyScore+clarityScore)/4);

return{
emotionScore,
hookScore,
storyScore,
clarityScore,
overall
};

}

/* ===============================
   UI
================================ */

function updateUI(){

document.getElementById("question").innerText=
"Question "+(state.index+1)+": "+QUESTIONS[state.index];

document.getElementById("stats").innerHTML=
`
<span class="stat">Level: ${state.level}</span>
<span class="stat">XP: ${state.xp}</span>
`;

}

updateUI();

/* ===============================
   SUBMIT
================================ */

function submitAnswer(){

let text=document.getElementById("answer").value;

if(text.length<10){
alert("اكتب إجابة أطول");
return;
}

let result=analyze(text);

let earned=result.overall*15;

state.xp+=earned;

if(state.xp>state.level*150){
state.level++;
}

state.index++;

localStorage.setItem("AITrainer",JSON.stringify(state));

document.getElementById("feedback").innerHTML=`

<h3>AI Analysis</h3>

Emotion: ${result.emotionScore}/10<br>
Hook: ${result.hookScore}/10<br>
Story Flow: ${result.storyScore}/10<br>
Clarity: ${result.clarityScore}/10

<h2>⭐ Overall ${result.overall}</h2>

XP Earned: ${earned}

`;

document.getElementById("answer").value="";

if(state.index>=QUESTIONS.length){

document.getElementById("question").innerText="🏆 Training Completed!";
return;

}

updateUI();

}

</script>

</body>
</html>
